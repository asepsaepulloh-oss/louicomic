<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Icon Box -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Dynamic Comic Flame Icon Emblem -->
  <g transform="translate(0, -10)">
    <!-- Flame Backdrop Glow -->
    <path d="M256 70 C210 150 150 195 150 275 C150 350 200 390 256 390 C312 390 362 350 362 275 C362 195 302 150 256 70 Z" fill="url(#flameGrad)" opacity="0.35" filter="url(#glow)"/>

    <!-- Dynamic Outer Flame -->
    <path d="M256 80 C215 160 162 205 162 280 C162 340 202 380 256 380 C310 380 350 340 350 280 C350 205 297 160 256 80 Z" fill="url(#flameGrad)"/>

    <!-- Inner Core Flame -->
    <path d="M256 155 C232 200 195 235 195 285 C195 325 220 355 256 355 C292 355 317 325 317 285 C317 235 280 200 256 155 Z" fill="#fbbf24"/>

    <!-- Bright Flame Center -->
    <path d="M256 220 C242 250 220 270 220 300 C220 325 235 340 256 340 C277 340 292 325 292 300 C292 270 270 250 256 220 Z" fill="#fffbeb"/>

    <!-- Open Manga / Comic Pages -->
    <g transform="translate(0, 35)">
      <!-- Page Shadow -->
      <path d="M256 295 C205 270 150 270 95 288 L95 365 C150 347 205 347 256 372 C307 347 362 347 417 365 L417 288 C362 270 307 270 256 295 Z" fill="#020617" opacity="0.4"/>
      <!-- Left Page -->
      <path d="M256 290 C205 265 150 265 95 282 L95 358 C150 340 205 340 256 365 Z" fill="url(#bookGrad)"/>
      <!-- Right Page -->
      <path d="M256 290 C307 265 362 265 417 282 L417 358 C362 340 307 340 256 365 Z" fill="url(#bookGrad)"/>
      <!-- Spine -->
      <line x1="256" y1="288" x2="256" y2="367" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
      <!-- Comic Lines -->
      <path d="M125 305 C160 295 195 295 225 305" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M125 325 C160 315 195 315 225 325" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M387 305 C352 295 317 295 287 305" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M387 325 C352 315 317 315 287 325" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>
