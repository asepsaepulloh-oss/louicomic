<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Icon Box -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- Flame Backdrop Glow -->
  <path d="M256 90 C220 160 170 200 170 270 C170 340 215 380 256 380 C297 380 342 340 342 270 C342 200 292 160 256 90 Z" fill="url(#flameGrad)" opacity="0.3" filter="url(#glow)"/>

  <!-- Dynamic Flame -->
  <path d="M256 100 C225 170 180 210 180 275 C180 330 215 370 256 370 C297 370 332 330 332 275 C332 210 287 170 256 100 Z" fill="url(#flameGrad)"/>
  <path d="M256 170 C235 210 205 240 205 285 C205 320 228 345 256 345 C284 345 307 320 307 285 C307 240 277 210 256 170 Z" fill="#fbbf24"/>

  <!-- Open Manga Book overlay -->
  <g transform="translate(0, 40)">
    <!-- Left Page -->
    <path d="M256 300 C210 275 160 275 110 290 L110 370 C160 355 210 355 256 380 Z" fill="url(#bookGrad)"/>
    <!-- Right Page -->
    <path d="M256 300 C302 275 352 275 402 290 L402 370 C352 355 302 355 256 380 Z" fill="url(#bookGrad)"/>
    <!-- Center Spine Line -->
    <line x1="256" y1="300" x2="256" y2="380" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Speed Lines / Comic Detail -->
    <path d="M140 315 C175 305 210 305 240 315" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M140 335 C175 325 210 325 240 335" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M372 315 C337 305 302 305 272 315" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M372 335 C337 325 302 325 272 335" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
