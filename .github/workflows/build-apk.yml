name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Generate Android App Icons & Splash
        run: npm run generate:assets

      - name: Build Web App & Sync Capacitor
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_SHINIGAMI_API_BASE: ${{ secrets.VITE_SHINIGAMI_API_BASE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Build Android Release & Debug APKs
        run: |
          cd android
          gradle assembleRelease assembleDebug --no-daemon

      - name: Copy & Rename APKs
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/LouiComic-Release.apk || cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/LouiComic-Release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/LouiComic-Debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LouiComic-Release-APK
          path: artifacts/LouiComic-Release.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LouiComic-Debug-APK
          path: artifacts/LouiComic-Debug.apk
          retention-days: 30
